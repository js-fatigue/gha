name: Test JS-Based Action steps

on:
  push:
    branches-ignore:
      - main
permissions:
  actions: write
  contents: write
  pull-requests: write
jobs:
  test-example-js:
    runs-on: ubuntu-latest

    steps:
      - name: Test Example (JS)
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- js-example-context -->';
            const { owner, repo } = context.repo;

            // --- Log context ---
            core.startGroup('Workflow Context');
            core.info(`Event:       ${context.eventName}`);
            core.info(`Workflow:    ${context.workflow}`);
            core.info(`Action:      ${context.action}`);
            core.info(`Actor:       ${context.actor}`);
            core.info(`Job:         ${context.job}`);
            core.info(`Run ID:      ${context.runId}`);
            core.info(`Run Number:  ${context.runNumber}`);
            core.info(`Run Attempt: ${process.env.GITHUB_RUN_ATTEMPT}`);
            core.info(`SHA:         ${context.sha}`);
            core.info(`Ref:         ${context.ref}`);
            core.info(`Server URL:  ${context.serverUrl}`);
            core.info(`API URL:     ${context.apiUrl}`);
            core.info(`GraphQL URL: ${context.graphqlUrl}`);
            core.endGroup();

            core.startGroup('Repository');
            core.info(`Owner: ${owner}`);
            core.info(`Repo:  ${repo}`);
            core.endGroup();

            // --- Job summary ---
            await core.summary
              .addHeading('Workflow Context', 2)
              .addTable([
                [{data: 'Field', header: true}, {data: 'Value', header: true}],
                [{data: 'Event'},       {data: context.eventName}],
                [{data: 'Workflow'},    {data: context.workflow}],
                [{data: 'Action'},      {data: context.action}],
                [{data: 'Actor'},       {data: context.actor}],
                [{data: 'Job'},         {data: context.job}],
                [{data: 'Run ID'},      {data: String(context.runId)}],
                [{data: 'Run Number'},  {data: String(context.runNumber)}],
                [{data: 'Run Attempt'}, {data: process.env.GITHUB_RUN_ATTEMPT || ''}],
                [{data: 'SHA'},         {data: context.sha}],
                [{data: 'Ref'},         {data: context.ref}],
                [{data: 'Server URL'},  {data: context.serverUrl}],
                [{data: 'API URL'},     {data: context.apiUrl}],
                [{data: 'GraphQL URL'}, {data: context.graphqlUrl}],
              ])
              .addSeparator()
              .addHeading('Repository', 2)
              .addTable([
                [{data: 'Field', header: true}, {data: 'Value', header: true}],
                [{data: 'Owner'}, {data: owner}],
                [{data: 'Repo'},  {data: repo}],
              ])
              .write();

            // --- Resolve PR number ---
            let prNumber = context.issue.number;
            if (!prNumber) {
              const branch = context.ref.replace('refs/heads/', '');
              if (branch === context.ref) return;
              const { data: prs } = await github.rest.pulls.list({
                owner, repo, head: `${owner}:${branch}`, state: 'open',
              });
              if (!prs.length) return;
              prNumber = prs[0].number;
            }

            // --- Build comment body ---
            const body = [
              marker,
              '## Workflow Context',
              '',
              '| Field | Value |',
              '|-------|-------|',
              `| Event | ${context.eventName} |`,
              `| Workflow | ${context.workflow} |`,
              `| Action | ${context.action} |`,
              `| Actor | ${context.actor} |`,
              `| Job | ${context.job} |`,
              `| Run ID | ${context.runId} |`,
              `| Run Number | ${context.runNumber} |`,
              `| Run Attempt | ${process.env.GITHUB_RUN_ATTEMPT || ''} |`,
              `| SHA | ${context.sha} |`,
              `| Ref | ${context.ref} |`,
              `| Server URL | ${context.serverUrl} |`,
              `| API URL | ${context.apiUrl} |`,
              `| GraphQL URL | ${context.graphqlUrl} |`,
              '',
              '## Repository',
              '',
              `**Owner:** ${owner}  `,
              `**Repo:** ${repo}`,
            ].join('\n');

            // --- Delete existing marker comment (paginated) ---
            outer: for await (const { data: comments } of github.paginate.iterator(
              github.rest.issues.listComments,
              { owner, repo, issue_number: prNumber, per_page: 100 }
            )) {
              for (const c of comments) {
                if (c.body.includes(marker)) {
                  await github.rest.issues.deleteComment({ owner, repo, comment_id: c.id });
                  break outer;
                }
              }
            }

            // --- Create fresh comment ---
            const { data: created } = await github.rest.issues.createComment({
              owner, repo, issue_number: prNumber, body,
            });
            core.info(`Created PR comment #${created.id}`);
