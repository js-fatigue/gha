name: PR Title Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  check-pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build gha-github
        run: |
          mkdir -p "${RUNNER_TEMP}/actions/gha-github/latest"
          go build -o "${RUNNER_TEMP}/actions/gha-github/latest/gha-github" ./actions/gha-github

      - name: Check PR title
        uses: ./actions/gha-github
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          command: check-pr-title
