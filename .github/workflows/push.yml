name: Push — Changed Directories

on:
  push:
    branches-ignore:
      - main

permissions:
  actions: write
  contents: read
  pull-requests: write

jobs:
  changed-dirs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build gha-github
        run: |
          mkdir -p "${RUNNER_TEMP}/actions/gha-github/latest"
          go build -o "${RUNNER_TEMP}/actions/gha-github/latest/gha-github" ./actions/gha-github

      - name: Detect changed directories
        id: changed-dirs
        uses: ./actions/gha-github
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          command: changed-dirs
          base: main
          max_depth: "2"

      - name: Log output
        shell: bash
        run: |
          echo "Changed dirs: ${{ steps.changed-dirs.outputs.dir_names }}"
