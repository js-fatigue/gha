name: Push — Changed Directories

on:
  push:
    branches-ignore:
      - main

permissions:
  actions: write
  contents: read
  pull-requests: write

jobs:
  changed-dirs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build & run gha-github
        id: changed-dirs
        shell: bash
        env:
          GITHUB_TOKEN: ${{ inputs.token }}
          INPUT_BASE: main
          INPUT_MAX_DEPTH: "2"
        run: |
          mkdir -p "${RUNNER_TEMP}/gha-github/latest"
          go build -o "${RUNNER_TEMP}/gha-github/latest/gha-github" ./gha-github-dev
          ./gha-github-dev changed-dirs

      - name: Log output
        shell: bash
        run: |
          echo "Changed dirs: ${{ steps.changed-dirs.outputs.dir_names }}"
