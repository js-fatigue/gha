name: Build Release Assets

on:
  push:
    tags:
      - '*-v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Extract family name from tag
        id: meta
        run: |
          TAG_NAME="${{ github.ref_name }}"
          FAMILY="${TAG_NAME%-v*}"
          echo "family=${FAMILY}" >> "$GITHUB_OUTPUT"

      - name: Build linux/amd64
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          go build -trimpath -ldflags="-w -s -buildid=" \
            -o "${{ steps.meta.outputs.family }}-linux-amd64" \
            ./actions/${{ steps.meta.outputs.family }}

      - name: Build linux/arm64
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: arm64
        run: |
          go build -trimpath -ldflags="-w -s -buildid=" \
            -o "${{ steps.meta.outputs.family }}-linux-arm64" \
            ./actions/${{ steps.meta.outputs.family }}

      - name: Generate checksums
        run: |
          sha256sum \
            "${{ steps.meta.outputs.family }}-linux-amd64" \
            "${{ steps.meta.outputs.family }}-linux-arm64" \
            > checksums.txt

      - name: Upload release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            "${{ steps.meta.outputs.family }}-linux-amd64" \
            "${{ steps.meta.outputs.family }}-linux-arm64" \
            checksums.txt
