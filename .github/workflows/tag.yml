name: Tag

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  changed-dirs:
    runs-on: ubuntu-latest
    outputs:
      dir_names: ${{ steps.changed-dirs.outputs.dir_names }}
    steps:
      - uses: bshore/gha/actions/github@github-v0.6.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          command: checkout
          input: |
            ref = "${{ github.ref_name }}"
            fetch_depth = 0

      - name: Detect changed directories
        id: changed-dirs
        uses: bshore/gha/actions/github@github-v0.6.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          command: changed-dirs
          input: |
            base = "${{ github.event.before }}"
            max_depth = 2

  release:
    needs: changed-dirs
    if: ${{ needs.changed-dirs.outputs.dir_names != '[]' }}
    strategy:
      matrix:
        dir: ${{ fromJson(needs.changed-dirs.outputs.dir_names) }}
    runs-on: ubuntu-latest
    steps:
      - uses: bshore/gha/actions/github@github-v0.6.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          command: checkout
          input: ref = "${{ github.ref_name }}"

      - name: Release
        id: release
        if: startsWith(matrix.dir, 'actions/') && matrix.dir != 'actions/yoink'
        uses: bshore/gha/actions/github@github-v0.6.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          command: release
          input: |
            action_dir = "${{ matrix.dir }}"
            release = true

      - name: Build and upload release assets
        if: startsWith(matrix.dir, 'actions/') && matrix.dir != 'actions/yoink'
        env:
          CGO_ENABLED: "0"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FAMILY=$(basename "${{ matrix.dir }}")
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-w -s -buildid=" \
            -o "${FAMILY}-linux-amd64" \
            ./${{ matrix.dir }}
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-w -s -buildid=" \
            -o "${FAMILY}-linux-arm64" \
            ./${{ matrix.dir }}
          sha256sum \
            "${FAMILY}-linux-amd64" \
            "${FAMILY}-linux-arm64" \
            > checksums.txt
          gh release upload "${{ steps.release.outputs.next_tag }}" \
            "${FAMILY}-linux-amd64" \
            "${FAMILY}-linux-arm64" \
            checksums.txt
