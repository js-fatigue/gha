name: Tag

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  changed-dirs:
    runs-on: ubuntu-latest
    outputs:
      dir_names: ${{ steps.changed-dirs.outputs.dir_names }}
    steps:
      - uses: bshore/gha/actions/github@github-v0.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          command: checkout
          checkout_input: '{"ref": "${{ github.ref_name }}", "fetch_depth": 0}'

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build github
        run: |
          mkdir -p "${RUNNER_TEMP}/actions/github/latest"
          go build -o "${RUNNER_TEMP}/actions/github/latest/github" ./actions/github

      - name: Detect changed directories
        id: changed-dirs
        uses: ./actions/github
        with:
          cache: "false"
          token: ${{ secrets.GITHUB_TOKEN }}
          command: changed-dirs
          changed_dirs_input: '{"base": "${{ github.event.before }}", "max_depth": 2}'

  release:
    needs: changed-dirs
    if: ${{ needs.changed-dirs.outputs.dir_names != '[]' }}
    strategy:
      matrix:
        dir: ${{ fromJson(needs.changed-dirs.outputs.dir_names) }}
    runs-on: ubuntu-latest
    steps:
      - uses: bshore/gha/actions/github@github-v0.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          command: checkout
          checkout_input: '{"ref": "${{ github.ref_name }}"}'

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build github
        run: |
          mkdir -p "${RUNNER_TEMP}/actions/github/latest"
          go build -o "${RUNNER_TEMP}/actions/github/latest/github" ./actions/github

      - name: Release
        id: release
        if: startsWith(matrix.dir, 'actions/')
        uses: ./actions/github
        with:
          cache: "false"
          token: ${{ secrets.GITHUB_TOKEN }}
          command: release
          release_input: '{"action_dir": "${{ matrix.dir }}", "release": true}'

      - name: Build and upload release assets
        if: startsWith(matrix.dir, 'actions/')
        env:
          CGO_ENABLED: "0"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FAMILY=$(basename "${{ matrix.dir }}")
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-w -s -buildid=" \
            -o "${FAMILY}-linux-amd64" \
            ./${{ matrix.dir }}
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-w -s -buildid=" \
            -o "${FAMILY}-linux-arm64" \
            ./${{ matrix.dir }}
          sha256sum \
            "${FAMILY}-linux-amd64" \
            "${FAMILY}-linux-arm64" \
            > checksums.txt
          gh release upload "${{ steps.release.outputs.next_tag }}" \
            "${FAMILY}-linux-amd64" \
            "${FAMILY}-linux-arm64" \
            checksums.txt
