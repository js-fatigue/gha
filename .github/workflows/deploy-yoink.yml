name: Publish Yoink Image

on:
  push:
    branches:
      - main
    paths:
      - "images/yoink/**"
      - ".github/workflows/deploy-yoink.yml"

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: bshore/gha/actions/github@github-v0.6.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          command: checkout
          input: |
            ref = "${{ github.ref_name }}"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          docker build -t ghcr.io/bshore/gha-yoink:latest \
                       -t ghcr.io/bshore/gha-yoink:sha-${SHORT_SHA} \
                       images/yoink
          docker push ghcr.io/bshore/gha-yoink:latest
          docker push ghcr.io/bshore/gha-yoink:sha-${SHORT_SHA}
