name: Test Github Actions

on:
  push:
    branches-ignore:
      - main
    paths:
      - .github/workflows/test-actions-github.yml
      - actions/github/**
      - actions/yoink/**

permissions:
  contents: read

jobs:
  test-actions-github:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: bshore/gha/actions/github@github-v0.8.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          command: checkout
          input: |
            ref = "${{ github.ref_name }}"
            fetch_depth = 0

      - name: Build github binary
        run: |
          mkdir -p "${RUNNER_TEMP}/actions/github/latest"
          go build -o "${RUNNER_TEMP}/actions/github/latest/github" ./actions/github

      - name: yoink
        id: yoink
        uses: ./actions/yoink

      - name: changed-dirs (source build)
        uses: ./actions/github
        env:
          ACTIONS_CACHE_URL: ${{ steps.yoink.outputs.ACTIONS_CACHE_URL }}
          ACTIONS_RUNTIME_TOKEN: ${{ steps.yoink.outputs.ACTIONS_RUNTIME_TOKEN }}
          ACTIONS_RESULTS_URL: ${{ steps.yoink.outputs.ACTIONS_RESULTS_URL }}
          ACTIONS_RUNTIME_URL: ${{ steps.yoink.outputs.ACTIONS_RUNTIME_URL }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          command: changed-dirs
          self_cache: "false"
          input: |
            base = "main"
            max_depth = 2

      - name: release dry run (source build)
        uses: ./actions/github
        env:
          ACTIONS_CACHE_URL: ${{ steps.yoink.outputs.ACTIONS_CACHE_URL }}
          ACTIONS_RUNTIME_TOKEN: ${{ steps.yoink.outputs.ACTIONS_RUNTIME_TOKEN }}
          ACTIONS_RESULTS_URL: ${{ steps.yoink.outputs.ACTIONS_RESULTS_URL }}
          ACTIONS_RUNTIME_URL: ${{ steps.yoink.outputs.ACTIONS_RUNTIME_URL }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          command: release
          self_cache: "false"
          input: |
            action_dir = "actions/github"
