name: Test Go-Based Action steps

on:
  push:
    branches-ignore:
      - main
permissions:
  actions: write
  contents: write
  pull-requests: write
jobs:
  test-example:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go environment
        uses: actions/setup-go@v6
        with:
          go-version: "1.23"

      - name: Test Example
        uses: ./actions/example
