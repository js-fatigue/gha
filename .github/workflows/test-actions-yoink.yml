name: Test Yoink Action

on:
  push:
    branches-ignore:
      - main
    paths:
      - "actions/yoink/**"
      - ".github/workflows/test-actions-yoink.yml"

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      # - uses: actions/checkout@v6
      - uses: bshore/gha/actions/github@github-v0.4.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          command: checkout

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Test build
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          docker build -t ghcr.io/bshore/gha-yoink:latest \
                       -t ghcr.io/bshore/gha-yoink:sha-${SHORT_SHA} \
                       actions/yoink
