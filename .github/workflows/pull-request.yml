name: Pull Request Checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  check-pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title
        uses: bshore/gha/actions/github@github-v0.8.0
        with:
          command: check-pr-title

  changed-dirs:
    runs-on: ubuntu-latest
    outputs:
      dir_names: ${{ steps.changed-dirs.outputs.dir_names }}
    steps:
      - uses: bshore/gha/actions/github@github-v0.8.0
        with:
          command: checkout
          input: |
            ref = "${{ github.head_ref }}"
            fetch_depth = 0

      - name: Detect changed directories
        id: changed-dirs
        uses: bshore/gha/actions/github@github-v0.8.0
        with:
          command: changed-dirs
          input: |
            base = "main"
            max_depth = 2
            include = ["actions/"]
            exclude = ["actions/yoink"]

  check-actions:
    needs: changed-dirs
    if: ${{ needs.changed-dirs.outputs.dir_names != '[]' }}
    strategy:
      matrix:
        dir: ${{ fromJson(needs.changed-dirs.outputs.dir_names) }}
    runs-on: ubuntu-latest
    steps:
      - uses: bshore/gha/actions/github@github-v0.8.0
        with:
          command: checkout
          input: |
            ref = "${{ github.head_ref }}"

      - name: Release (dry run)
        uses: bshore/gha/actions/github@github-v0.8.0
        with:
          command: release
          input: |
            action_dir = "${{ matrix.dir }}"
