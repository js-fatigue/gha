name: Pull Request Checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  check-pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: bshore/gha/actions/github@github-v0.2.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          command: checkout
          checkout_input: '{"ref": "${{ github.head_ref }}"}'

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build github
        run: |
          mkdir -p "${RUNNER_TEMP}/actions/github/latest"
          go build -o "${RUNNER_TEMP}/actions/github/latest/github" ./actions/github

      - name: Check PR title
        uses: ./actions/github
        with:
          cache: "false"
          token: ${{ secrets.GITHUB_TOKEN }}
          command: check-pr-title

  changed-dirs:
    runs-on: ubuntu-latest
    outputs:
      dir_names: ${{ steps.changed-dirs.outputs.dir_names }}
    steps:
      - uses: bshore/gha/actions/github@github-v0.2.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          command: checkout
          checkout_input: '{"ref": "${{ github.head_ref }}", "fetch_depth": 0}'

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build github
        run: |
          mkdir -p "${RUNNER_TEMP}/actions/github/latest"
          go build -o "${RUNNER_TEMP}/actions/github/latest/github" ./actions/github

      - name: Detect changed directories
        id: changed-dirs
        uses: ./actions/github
        with:
          cache: "false"
          token: ${{ secrets.GITHUB_TOKEN }}
          command: changed-dirs
          changed_dirs_input: '{"base": "main", "max_depth": 2}'

  check-actions:
    needs: changed-dirs
    if: ${{ needs.changed-dirs.outputs.dir_names != '[]' }}
    strategy:
      matrix:
        dir: ${{ fromJson(needs.changed-dirs.outputs.dir_names) }}
    runs-on: ubuntu-latest
    steps:
      - uses: bshore/gha/actions/github@github-v0.2.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          command: checkout
          checkout_input: '{"ref": "${{ github.head_ref }}"}'

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build github
        run: |
          mkdir -p "${RUNNER_TEMP}/actions/github/latest"
          go build -o "${RUNNER_TEMP}/actions/github/latest/github" ./actions/github

      - name: Release (dry run)
        if: startsWith(matrix.dir, 'actions/')
        uses: ./actions/github
        with:
          cache: "false"
          token: ${{ secrets.GITHUB_TOKEN }}
          command: release
          release_input: '{"action_dir": "${{ matrix.dir }}"}'
