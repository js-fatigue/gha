name: GitHub Actions
description: Runs GitHub-specific commands via a compiled Go binary.

inputs:
  token:
    description: GitHub token for API calls
    required: true
    default: ${{ github.token }}
  command:
    description: Command to run (e.g. changed-dirs)
    required: true
  base:
    description: Base ref or SHA to compare against
    required: false
    default: "main"
  max_depth:
    description: >
      Maximum directory depth to return (0 = unlimited).
      E.g. depth 2 maps "a/b/c" → "a/b".
    required: false
    default: "0"
  action_dir:
    description: >
      Path to the action family directory (e.g. actions/github).
      Used by the release command.
    required: false
    default: ""
  release:
    description: >
      When true, create the GitHub release. When false (default), dry-run only.
      Used by the release command.
    required: false
    default: "false"
  cache:
    description: >
      When true (default), cache the downloaded binary using actions/cache.
      Set to false when the binary is built from source in the same job.
    required: false
    default: "true"

outputs:
  dir_names:
    description: JSON array of unique directories with changed files (e.g. ["actions/github"])
    value: ${{ steps.run.outputs.dir_names }}
  next_tag:
    description: Tag created and released (only set when command=release and release=true)
    value: ${{ steps.run.outputs.next_tag }}

runs:
  using: composite
  steps:
    - id: version
      if: inputs.cache == 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
      run: |
        v="${GHA_GITHUB_VERSION:-}"
        if [[ -z "$v" ]]; then
          v=$(gh release view --repo bshore/gha latest --json tagName -q .tagName 2>/dev/null || echo "latest")
        fi
        echo "tag=${v}" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@v4
      if: inputs.cache == 'true'
      with:
        path: ${{ runner.temp }}/actions/github
        key: github-${{ runner.os }}-${{ runner.arch }}-${{ steps.version.outputs.tag }}
        restore-keys: |
          github-${{ runner.os }}-${{ runner.arch }}-

    - id: run
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        INPUT_BASE: ${{ inputs.base }}
        INPUT_MAX_DEPTH: ${{ inputs.max_depth }}
        INPUT_ACTION_DIR: ${{ inputs.action_dir }}
        INPUT_RELEASE: ${{ inputs.release }}
        GHA_GITHUB_VERSION: ${{ steps.version.outputs.tag }}
      run: |
        chmod +x ${{ github.action_path }}/scripts/bootstrap.sh
        ${{ github.action_path }}/scripts/bootstrap.sh "${{ inputs.command }}"
