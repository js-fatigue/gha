name: GitHub Actions
description: Runs GitHub-specific commands via a compiled Go binary.

inputs:
  token:
    description: GitHub token for API calls
    required: true
    default: ${{ github.token }}
  command:
    description: Command to run (e.g. changed-dirs)
    required: true
  changed_dirs_input:
    description: >
      JSON options for the changed-dirs command. Fields: base (default: auto-detected
      from origin/HEAD, then origin/main or origin/master, then "main"), max_depth
      (int, default 0 = unlimited). Omit entirely for standard usage.
    required: false
    default: ""
  release_input:
    description: JSON options for the release command
    required: false
    default: ""
  checkout_input:
    description: >
      JSON options for the checkout command. All fields have sane defaults matching
      actions/checkout@v4: repository=$GITHUB_REPOSITORY, ref=$GITHUB_REF,
      fetch_depth=1, clean=true, persist_credentials=true, set_safe_directory=true.
      Omit entirely for standard usage.
    required: false
    default: ""
  self_cache:
    description: >
      When true (default), the binary self-caches via the Actions cache API
      after first download. Set to false when the binary is built from source
      in the same job.
    required: false
    default: "true"

outputs:
  dir_names:
    description: JSON array of unique directories with changed files (e.g. ["actions/github"])
    value: ${{ steps.run.outputs.dir_names }}
  next_tag:
    description: Tag created and released (only set when command=release and release=true)
    value: ${{ steps.run.outputs.next_tag }}
  ref:
    description: The branch or tag ref that was checked out
    value: ${{ steps.run.outputs.ref }}
  commit:
    description: The commit SHA that was checked out
    value: ${{ steps.run.outputs.commit }}

runs:
  using: composite
  steps:
    - id: version
      if: inputs.self_cache == 'true'
      shell: bash
      run: |
        v=$(basename "$(dirname "$(dirname "${{ github.action_path }}")")")
        echo "tag=${v}" >> "$GITHUB_OUTPUT"
    - id: yoink
      uses: bshore/gha/actions/yoink@main
    - id: run
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        INPUT_CHANGED_DIRS_INPUT: ${{ inputs.changed_dirs_input }}
        INPUT_RELEASE_INPUT: ${{ inputs.release_input }}
        INPUT_CHECKOUT_INPUT: ${{ inputs.checkout_input }}
        GHA_GITHUB_VERSION: ${{ steps.version.outputs.tag }}
        INPUT_SELF_CACHE: ${{ inputs.self_cache }}
        ACTIONS_CACHE_URL: ${{ steps.yoink.outputs.ACTIONS_CACHE_URL }}
        ACTIONS_RUNTIME_TOKEN: ${{ steps.yoink.outputs.ACTIONS_RUNTIME_TOKEN }}
        ACTIONS_RESULTS_URL: ${{ steps.yoink.outputs.ACTIONS_RESULTS_URL }}
        ACTIONS_RUNTIME_URL: ${{ steps.yoink.outputs.ACTIONS_RUNTIME_URL }}
      run: |
        chmod +x ${{ github.action_path }}/scripts/bootstrap.sh
        ${{ github.action_path }}/scripts/bootstrap.sh "${{ inputs.command }}"
