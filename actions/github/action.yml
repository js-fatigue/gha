name: GitHub Actions
description: Runs GitHub-specific commands via a compiled Go binary.

inputs:
  token:
    description: GitHub token for API calls
    required: true
    default: ${{ github.token }}
  command:
    description: Command to run (e.g. changed-dirs)
    required: true
  changed_dirs_input:
    description: JSON options for the changed-dirs command
    required: false
    default: ""
  release_input:
    description: JSON options for the release command
    required: false
    default: ""
  checkout_input:
    description: JSON options for the checkout command
    required: false
    default: ""
  cache:
    description: >
      When true (default), cache the downloaded binary using actions/cache.
      Set to false when the binary is built from source in the same job.
    required: false
    default: "true"

outputs:
  dir_names:
    description: JSON array of unique directories with changed files (e.g. ["actions/github"])
    value: ${{ steps.run.outputs.dir_names }}
  next_tag:
    description: Tag created and released (only set when command=release and release=true)
    value: ${{ steps.run.outputs.next_tag }}
  ref:
    description: The branch or tag ref that was checked out
    value: ${{ steps.run.outputs.ref }}
  commit:
    description: The commit SHA that was checked out
    value: ${{ steps.run.outputs.commit }}

runs:
  using: composite
  steps:
    - id: version
      if: inputs.cache == 'true'
      shell: bash
      run: |
        echo "tag=${GHA_GITHUB_VERSION:-${{ github.action_ref }}}" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@v4
      if: inputs.cache == 'true'
      with:
        path: ${{ runner.temp }}/actions/github
        key: github-${{ runner.os }}-${{ runner.arch }}-${{ steps.version.outputs.tag }}
        restore-keys: |
          github-${{ runner.os }}-${{ runner.arch }}-

    - id: run
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        INPUT_CHANGED_DIRS_INPUT: ${{ inputs.changed_dirs_input }}
        INPUT_RELEASE_INPUT: ${{ inputs.release_input }}
        INPUT_CHECKOUT_INPUT: ${{ inputs.checkout_input }}
        GHA_GITHUB_VERSION: ${{ steps.version.outputs.tag }}
      run: |
        chmod +x ${{ github.action_path }}/scripts/bootstrap.sh
        ${{ github.action_path }}/scripts/bootstrap.sh "${{ inputs.command }}"
