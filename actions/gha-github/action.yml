name: GitHub Actions
description: Runs GitHub-specific commands via a compiled Go binary.

inputs:
  token:
    description: GitHub token for API calls
    required: true
    default: ${{ github.token }}
  command:
    description: Command to run (e.g. changed-dirs)
    required: true
  base:
    description: Base ref or SHA to compare against
    required: false
    default: "main"
  max_depth:
    description: >
      Maximum directory depth to return (0 = unlimited).
      E.g. depth 2 maps "a/b/c" → "a/b".
    required: false
    default: "0"

outputs:
  dir_names:
    description: JSON array of unique directories with changed files (e.g. ["actions/gha-github"])
    value: ${{ steps.run.outputs.dir_names }}

runs:
  using: composite
  steps:
    - id: run
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        INPUT_BASE: ${{ inputs.base }}
        INPUT_MAX_DEPTH: ${{ inputs.max_depth }}
      run: |
        chmod +x ${{ github.action_path }}/scripts/bootstrap.sh
        ${{ github.action_path }}/scripts/bootstrap.sh "${{ inputs.command }}"
