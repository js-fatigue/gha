name: Go Actions
description: Runs Go-specific commands via a compiled Go binary.

inputs:
  token:
    description: GitHub token for API calls
    required: true
    default: ${{ github.token }}
  command:
    description: Command to run (e.g. build)
    required: true
  build_input:
    description: >
      JSON options for the build command. Fields: working_directory (default "."),
      output (default: go toolchain default), ldflags, cgo_enabled (default "0").
      Omit entirely to build the package in the current directory.
    required: false
    default: ""
  setup_input:
    description: >
      JSON options for the setup command. Fields: go_version (default: auto-detected
      from go.mod if present, otherwise "stable"), go_version_file (path to go.mod
      or .go-version), check_latest (bool, default false), cache_go_modules (bool,
      default true), cache_go_install (bool, default true), cache_dependency_path
      (glob for go.sum files, default "**/go.sum"). Omit entirely for standard
      usage — go.mod is detected automatically.
    required: false
    default: ""
  self_cache:
    description: >
      When true (default), the binary self-caches via the Actions cache API
      after first download. Set to false when the binary is built from source
      in the same job.
    required: false
    default: "true"

outputs:
  binary_path:
    description: Path to the compiled binary (only set when output is non-empty)
    value: ${{ steps.run.outputs.binary_path }}
  go_version:
    description: The resolved Go version that was installed (only set when command=setup)
    value: ${{ steps.run.outputs.go_version }}

runs:
  using: composite
  steps:
    - id: version
      if: inputs.self_cache == 'true'
      shell: bash
      run: |
        v=$(basename "$(dirname "$(dirname "${{ github.action_path }}")")")
        echo "tag=${v}" >> "$GITHUB_OUTPUT"
    - id: yoink
      uses: bshore/gha/actions/yoink@main
    - id: run
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        INPUT_BUILD_INPUT: ${{ inputs.build_input }}
        INPUT_SETUP_INPUT: ${{ inputs.setup_input }}
        GHA_GO_VERSION: ${{ steps.version.outputs.tag }}
        INPUT_SELF_CACHE: ${{ inputs.self_cache }}
        ACTIONS_CACHE_URL: ${{ steps.yoink.outputs.ACTIONS_CACHE_URL }}
        ACTIONS_RUNTIME_TOKEN: ${{ steps.yoink.outputs.ACTIONS_RUNTIME_TOKEN }}
        ACTIONS_RESULTS_URL: ${{ steps.yoink.outputs.ACTIONS_RESULTS_URL }}
        ACTIONS_RUNTIME_URL: ${{ steps.yoink.outputs.ACTIONS_RUNTIME_URL }}
      run: |
        chmod +x ${{ github.action_path }}/scripts/bootstrap.sh
        ${{ github.action_path }}/scripts/bootstrap.sh "${{ inputs.command }}"
