name: Example
description: Logs workflow context, writes a job summary, and upserts a PR comment.

inputs:
  token:
    description: GitHub token for API calls
    required: true
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Build
      shell: bash
      working-directory: ${{ github.action_path }}/../..
      run: go build -o ${{ github.action_path }}/example ./actions/example

    - name: Run
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
      run: ${{ github.action_path }}/example
